<aside id="timerNavbar" class="timer-panel" aria-label="Cronômetro">
    <div id="displayTime" class="timer-display bg-primary text-white rounded">00:00:00</div>
    <div id="displayParte" class="timer-display bg-secondary text-white rounded">00:00:00</div>
    <div class="timer-acoes">
        <button id="startMeeting" class="btn btn-success rounded-circle timer-acao"><i class="bi bi-play-fill"></i></button>
        <button id="pauseMeeting" class="btn btn-warning rounded-circle timer-acao"><i class="bi bi-pause-fill"></i></button>
        <button id="startParte" class="btn btn-primary rounded-circle timer-acao"><i class="bi bi-play-circle"></i></button>
        <button id="endParte" class="btn btn-info rounded-circle timer-acao"><i class="bi bi-stop-fill"></i></button>
        <button id="lastParte" class="btn btn-info rounded-circle timer-acao"><i class="bi bi-arrow-up-circle"></i></button>
        <button id="nextParte" class="btn btn-info rounded-circle timer-acao"><i class="bi bi-arrow-down-circle"></i></button>
    </div>
</aside>
