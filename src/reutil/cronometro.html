<aside id="timerNavbar" class="timer-panel" aria-label="Cronômetro">
    <div id="displayTime" style="--ordem: 0" title="Tempo da reunião" class="timer-display bg-primary text-white rounded">00:00:00</div>
    <div id="displayParte" style="--ordem: 1" title="Tempo da parte" class="timer-display bg-secondary text-white rounded">00:00:00</div>
    <div class="timer-acoes">
        <button id="startMeeting" style="--ordem: 2" title="Iniciar reunião" aria-label="Iniciar reunião" class="btn btn-success rounded-circle timer-acao"><i class="bi bi-play-fill"></i></button>
        <button id="pauseMeeting" style="--ordem: 3" title="Pausar reunião" aria-label="Pausar reunião" class="btn btn-warning rounded-circle timer-acao"><i class="bi bi-pause-fill"></i></button>
        <button id="startParte" style="--ordem: 4" title="Iniciar parte" aria-label="Iniciar parte" class="btn btn-primary rounded-circle timer-acao"><i class="bi bi-play-circle"></i></button>
        <button id="endParte" style="--ordem: 5" title="Encerrar parte" aria-label="Encerrar parte" class="btn btn-info rounded-circle timer-acao"><i class="bi bi-stop-fill"></i></button>
        <button id="lastParte" style="--ordem: 6" title="Parte anterior" aria-label="Parte anterior" class="btn btn-info rounded-circle timer-acao"><i class="bi bi-arrow-up-circle"></i></button>
        <button id="nextParte" style="--ordem: 7" title="Próxima parte" aria-label="Próxima parte" class="btn btn-info rounded-circle timer-acao"><i class="bi bi-arrow-down-circle"></i></button>
    </div>
</aside>
