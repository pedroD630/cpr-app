<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <script src="/src/script/tema.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/src/style/style.css" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <main class="container mt-5 acesso">
        <h1 class="h2 mb-4 text-center">Entrar</h1>

        <div id="mensagemAcesso" class="alert d-none" role="alert"></div>

        <form id="formAcesso">
            <div class="mb-3">
                <label for="login" class="form-label">Usuário ou e-mail</label>
                <input type="text" class="form-control" id="login" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" autocomplete="current-password" required>
            </div>

            <button type="submit" id="enviarAcesso" class="btn btn-primary w-100 mb-3">Entrar</button>
        </form>

        <p class="text-center small text-body-secondary">O cadastro de congregações é feito pelo administrador.</p>
        <p class="text-center small"><a href="/src/termos.html">Termos de uso</a></p>
    </main>

    <script type="module" src="/src/script/login.js"></script>
</body>
</html>
