<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <script src="/src/script/tema.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/src/style/style.css" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <main class="container mt-5 acesso">
        <h1 id="tituloAcesso" class="h2 mb-4 text-center">Entrar</h1>

        <div id="mensagemAcesso" class="alert d-none" role="alert"></div>

        <form id="formAcesso">
            <div id="campoCongregacao" class="mb-3 d-none">
                <label for="nomeCongregacao" class="form-label">Nome da congregação</label>
                <input type="text" class="form-control" id="nomeCongregacao" autocomplete="organization">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail da congregação</label>
                <input type="email" class="form-control" id="email" autocomplete="username" required>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" autocomplete="current-password" minlength="6" required>
            </div>

            <div id="campoTermos" class="form-check mb-3 d-none">
                <input type="checkbox" class="form-check-input" id="aceitouTermos">
                <label for="aceitouTermos" class="form-check-label">Li e aceito os <a href="/src/termos.html" target="_blank" rel="noopener">termos de uso</a></label>
            </div>

            <button type="submit" id="enviarAcesso" class="btn btn-primary w-100 mb-3">Entrar</button>
        </form>

        <button type="button" id="alternarAcesso" class="btn btn-link w-100">Cadastrar congregação</button>
    </main>

    <script type="module" src="/src/script/login.js"></script>
</body>
</html>
